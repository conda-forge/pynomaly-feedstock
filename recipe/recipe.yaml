schema_version: 1

context:
  name: pynomaly
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: bf3d2c4c9b4ed65f9b9ec618b4cc0f54ab0ef0cd564db6abebf7992794dc5c30

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - numpy
    - python >=${{ python_min }}
    - python-utils

tests:
  - python:
      imports:
        - PyNomaly
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: "A Python 3 implementation of LoOP: Local Outlier Probabilities."
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/vc1492a/PyNomaly

extra:
  recipe-maintainers:
    - thewchan
